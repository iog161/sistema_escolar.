{% extends "base.html" %}
{% block conteudo %}
<h2>Página inicial</h2>
<p>Bem-vindo ao Sistema Escolar. Escolha um cadastro para consultar ou registrar informações.</p>
<div class="cartoes">
    {% for recurso, config in configs.items() %}
    <section class="cartao">
        <h3>{{ config.titulo }}</h3>
        <a class="botao" href="{{ url_for('listar', recurso=recurso) }}">Abrir cadastro</a>
    </section>
    {% endfor %}
</div>
{% endblock %}
